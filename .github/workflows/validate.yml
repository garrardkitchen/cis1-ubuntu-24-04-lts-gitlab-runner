name: Validate image repository
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: latest
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
      - name: Validate Bash and security inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq unzip zip
          bash tests/test.sh
          shellcheck -x scripts/*.sh scripts/lib/*.sh tests/*.sh
          mkdir -p artifacts
      - name: Validate Packer with offline fixture
        run: |
          packer init packer
          packer validate -var-file=config/validation.example.pkrvars.hcl packer
      - name: Validate Terraform
        if: always()
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Check Packer formatting
        if: always()
        run: packer fmt -check -diff packer
      - name: Check Terraform formatting
        if: always()
        run: terraform -chdir=infra/terraform fmt -check -diff
